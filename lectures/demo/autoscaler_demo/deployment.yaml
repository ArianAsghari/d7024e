apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello
  labels:
    app: hello-world
    component: deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
      component: web
  template:
    metadata:
      labels:
        app: hello-world
        component: web
        version: v1
    spec:
      containers:
      - name: web
        image: johan/helloworld-test:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
