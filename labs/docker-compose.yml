# See https://docs.docker.com/compose/compose-file/ for information about what
# commands you can use in this file.
#
# Note that you must use the `docker stack deploy` command, with any required
# command line flags, in order to actually get any replicas started. That
# command requires that a docker swarm is already running in order to function.

version: "3"
services:
  bootstrap:
    image: kadlab:latest
    environment:
      HEADLESS: "1"
      REPLICATION_INTERVAL: "1h"
      OWNERS_FILE: "/shared/owners.json"
    volumes:
      - registry_shared:/shared
    deploy:
      replicas: 1
      # Resolve the node's actual IP, rather than a virtual service IP whose
      # hash would disagree with its advertised node ID.
      endpoint_mode: dnsrr
    networks:
      - kademlia_network
  kademliaNodes:
    image: kadlab:latest # Make sure your Docker image has this name.
    stdin_open: true
    tty: true
    environment:
      HEADLESS: "1"
      BOOTSTRAP: "bootstrap:8000"
      REPLICATION_INTERVAL: "1h"
      OWNERS_FILE: "/shared/owners.json"
    volumes:
      - registry_shared:/shared
    deploy:
      # 5 replicas for fast local dev. The lab requires demonstrating at
      # least 50; scale up for that with:
      #   docker service scale kademlia_kademliaNodes=49
      # Together with the bootstrap, that is 50 nodes.
      mode: replicated
      replicas: 5
#        resources:
#           limits:
#              cpus: "0.1"
#              memory: 50M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 10s
#    ports:
#      - "4000:80"
    networks:
      - kademlia_network
      
networks:
  kademlia_network:
    attachable: true

# Part 2 (package registry): every node must see the same domain -> public key
# table, which stands in for DNS TXT records. The volume holds that one file
# (owners.json). It is a named volume, so it is shared by all containers on one
# Docker host, which is what this lab setup uses. Private keys stay inside each
# container (KEYS_DIR, default /keys), so run keygen and publish in the same
# container session, or mount a directory of your own at /keys.
volumes:
  registry_shared:
